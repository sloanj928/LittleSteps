<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Little Steps</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #fffdf8;
        color: #2a332e;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 auto 24px;
        max-width: 32ch;
      }
      a {
        display: inline-block;
        min-height: 48px;
        line-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: #3f7a63;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #11150f;
          color: #e6ebe7;
        }
        a {
          background: #a9d6bf;
          color: #10271d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Little Steps needs a connection to show and save your baby's moments. Nothing has been lost.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
